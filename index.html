<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>词链｜WordChain 2.2</title>
<style>
:root{--bg:#0b1020;--card:#151c2f;--card2:#1c2640;--text:#f4f7fb;--muted:#9ba8bd;--accent:#8ab4ff;--good:#62d89b;--bad:#ff7d8a;--line:#2a3550}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b2745 0,#0b1020 45%,#070b14 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
button{font:inherit} .wrap{width:min(680px,100%);margin:auto;padding:22px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;letter-spacing:.4px}.tag{font-size:12px;color:var(--muted)}
.card{background:rgba(21,28,47,.92);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin-bottom:14px}
h1{font-size:34px;line-height:1.12;margin:0 0 12px}h2{font-size:22px;margin:0 0 10px}p{line-height:1.65}.muted{color:var(--muted)}
.btn{width:100%;border:0;border-radius:16px;padding:15px 16px;margin-top:10px;background:var(--accent);color:#07101e;font-weight:800}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.small{width:auto;padding:10px 13px;margin:0;font-size:14px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:var(--card2);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}
.progress{height:7px;background:#222c44;border-radius:99px;overflow:hidden;margin:12px 0 16px}.progress i{display:block;height:100%;background:var(--accent);width:0}
.word{text-align:center;padding:18px 8px}.word .en{font-size:40px;font-weight:850;letter-spacing:.5px;word-break:break-word}.word .meta{color:var(--muted);font-size:13px;margin-top:8px;min-height:20px}
.options{display:grid;gap:10px;margin-top:12px}.opt{background:var(--card2);border:1px solid var(--line);color:var(--text);padding:15px;border-radius:16px;text-align:left}.opt:active{transform:scale(.99)}.opt.good{border-color:var(--good);background:rgba(98,216,155,.12)}.opt.bad{border-color:var(--bad);background:rgba(255,125,138,.12)}
.feedback{text-align:center;min-height:28px;font-weight:700;margin-top:12px}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.pill{display:inline-block;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 10px;font-size:12px;color:var(--muted);margin:3px}
.hide{display:none}.source{font-size:11px;color:#7f8ba1;margin-top:14px}.list{max-height:360px;overflow:auto}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item b{display:block}.item span{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">词链 · WordChain</div><div class="tag">V2.2 · CET-6 × 考研</div></div>

  <section id="home" class="card">
    <div class="pill" id="loadStatus">正在加载词库…</div>
    <h1>把背单词，<br>变成一场游戏。</h1>
    <p class="muted">不是几十个示例词。V2.2 会读取完整的六级与考研词库，并把你的错误记录进「记忆链」。</p>
    <div class="stats">
      <div class="stat"><b id="totalWords">—</b><span>可用词条</span></div>
      <div class="stat"><b id="knownCount">0</b><span>已掌握</span></div>
      <div class="stat"><b id="wrongCount">0</b><span>待强化</span></div>
    </div>
    <button class="btn" onclick="startGame()">开始对对碰</button>
    <button class="btn secondary" onclick="showMemory()">查看记忆链</button>
    <button class="btn secondary" id="soundBtn" onclick="unlockSound()">🔊 开启音效</button>
    <div class="source">词库基础数据：KyleBing/english-vocabulary，包含 CET-6 约 5,651 词、考研约 9,602 词；本页面仅用于学习用途。</div>
  </section>

  <section id="game" class="card hide">
    <div class="row between"><span id="qNo" class="muted">1 / 10</span><span id="timer" class="pill">15s</span><button class="btn small secondary" onclick="toggleSound()">🔊</button></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="word"><div class="en" id="word">—</div><div class="meta" id="meta">—</div></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback"></div>
    <button id="nextBtn" class="btn hide" onclick="nextQuestion()">下一题</button>
  </section>

  <section id="result" class="card hide">
    <h2>本轮完成</h2>
    <p id="resultText"></p>
    <div class="stats"><div class="stat"><b id="rScore">0</b><span>得分</span></div><div class="stat"><b id="rCorrect">0</b><span>答对</span></div><div class="stat"><b id="rWrong">0</b><span>强化</span></div></div>
    <button class="btn" onclick="startGame()">再来一轮</button>
    <button class="btn secondary" onclick="showMemory()">查看记忆链</button>
    <button class="btn secondary" onclick="goHome()">返回首页</button>
  </section>

  <section id="memory" class="card hide">
    <div class="row between"><h2>记忆链</h2><button class="btn small secondary" onclick="goHome()">返回</button></div>
    <p class="muted">这里不是简单的“错题数量”。每个词都会累积你的错误次数和最近表现。</p>
    <div id="memoryList" class="list"></div>
  </section>
</div>

<script>
const SOURCES = [
  "https://raw.githubusercontent.com/KyleBing/english-vocabulary/master/4%20%E5%85%AD%E7%BA%A7-%E4%B9%B1%E5%BA%8F.txt",
  "https://raw.githubusercontent.com/KyleBing/english-vocabulary/master/5%20%E8%80%83%E7%A0%94-%E4%B9%B1%E5%BA%8F.txt"
];
const FALLBACK = [
 ["ability","n. 能力，能耐；才能"],["abandon","v. 放弃；抛弃"],["abstract","adj. 抽象的 n. 摘要"],["accurate","adj. 精确的"],["adapt","v. 适应；改编"],["advocate","v. 提倡 n. 拥护者"],["ambiguous","adj. 模棱两可的"],["analysis","n. 分析"],["approach","n. 方法；途径 v. 接近"],["assume","v. 假定；认为"],["capacity","n. 能力；容量"],["contribute","v. 贡献；促成"],["controversy","n. 争议"],["derive","v. 获得；源于"],["distinguish","v. 区分；辨别"],["emphasize","v. 强调"],["evolve","v. 发展；进化"],["fundamental","adj. 基本的"],["implement","v. 实施"],["inevitable","adj. 不可避免的"]
].map(x=>({word:x[0],def:x[1],sources:["fallback"]}));

let words=[], round=[], idx=0, score=0, correct=0, wrong=0, combo=0, time=15, timerId=null, soundOn=true, audioCtx=null;

const $=id=>document.getElementById(id);
function cleanDef(s){return (s||"").replace(/\s+/g," ").trim()}
function parseTxt(txt, source){
  return txt.split(/\r?\n/).map(line=>{
    const i=line.indexOf("\t"); if(i<0)return null;
    const w=line.slice(0,i).trim().toLowerCase(); const d=cleanDef(line.slice(i+1));
    if(!/^[a-z][a-z' -]{1,40}$/.test(w)||!d)return null;
    return {word:w,def:d,sources:[source]};
  }).filter(Boolean);
}
function merge(list){
  const m=new Map();
  list.forEach(x=>{if(!m.has(x.word))m.set(x.word,{...x});else{m.get(x.word).sources=[...new Set([...m.get(x.word).sources,...x.sources])]}});
  return [...m.values()];
}
async function loadWords(){
  try{
    const res=await Promise.all(SOURCES.map(u=>fetch(u,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("load");return r.text()})));
    words=merge([parseTxt(res[0],"CET-6"),parseTxt(res[1],"考研")]);
    $("loadStatus").textContent=`词库已载入 · ${words.length.toLocaleString()} 词`;
  }catch(e){
    words=FALLBACK;
    $("loadStatus").textContent="网络词库暂时不可用 · 已启用离线备用词库";
  }
  $("totalWords").textContent=words.length.toLocaleString();
  refreshCounts();
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getStats(){try{return JSON.parse(localStorage.getItem("wc_stats")||"{}")}catch{return {}}}
function saveStats(s){localStorage.setItem("wc_stats",JSON.stringify(s))}
function refreshCounts(){const s=getStats();$("knownCount").textContent=Object.values(s).filter(x=>x.correct>=2&&x.wrong===0).length;$("wrongCount").textContent=Object.values(s).filter(x=>x.wrong>0).length}
function ensureAudio(){
  if(!soundOn)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
  }catch(e){}
}
function tone(freq,dur=.08,type="sine",gain=.045){
  if(!soundOn)return; ensureAudio(); if(!audioCtx)return;
  try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}
}
function unlockSound(){soundOn=true;ensureAudio();tone(880,.14,"sine",.08);$("soundBtn").textContent="🔊 音效已开启"}
function toggleSound(){soundOn=!soundOn;if(soundOn){unlockSound()}else{$("soundBtn").textContent="🔇 音效已关闭"}}
function playGood(){tone(660,.07);setTimeout(()=>tone(880,.11),65)}
function playBad(){tone(180,.16,"sawtooth",.035)}
function playClick(){tone(420,.045,"sine",.025)}

function startGame(){
  if(!words.length)return;
  ensureAudio();playClick();
  $("home").classList.add("hide");$("memory").classList.add("hide");$("result").classList.add("hide");$("game").classList.remove("hide");
  const s=getStats(); const weak=words.filter(w=>s[w.word]&&s[w.word].wrong>0); const pool=shuffle([...weak.slice(0,Math.min(120,weak.length)),...words]).slice(0,Math.min(10,words.length));
  round=pool;idx=0;score=0;correct=0;wrong=0;combo=0;showQuestion();
}
function showQuestion(){
  clearInterval(timerId);time=15;$("timer").textContent="15s";$("qNo").textContent=`${idx+1} / ${round.length}`;$("bar").style.width=`${idx/round.length*100}%`;
  const item=round[idx];$("word").textContent=item.word;$("meta").textContent=item.sources.includes("CET-6")&&item.sources.includes("考研")?"CET-6 · 考研":item.sources[0];
  const others=shuffle(words.filter(w=>w.word!==item.word)).slice(0,3);const opts=shuffle([item,...others]);$("options").innerHTML="";
  $("feedback").textContent="";$("feedback").className="feedback";$("nextBtn").classList.add("hide");
  opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o.def;b.onclick=()=>answer(b,o,item);$("options").appendChild(b)});
  timerId=setInterval(()=>{time--; $("timer").textContent=time+"s"; if(time<=0){clearInterval(timerId);answer(null,null,item,true)}},1000);
}
function answer(btn,chosen,item,timeout=false){
  if($("nextBtn").classList.contains("hide")===false)return;
  clearInterval(timerId);const stat=getStats();stat[item.word]=stat[item.word]||{wrong:0,correct:0,last:0};
  const ok=!timeout&&chosen&&chosen.word===item.word;
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  if(ok){correct++;combo++;score+=100+Math.max(0,combo-1)*20;stat[item.word].correct++;stat[item.word].last=Date.now();if(btn)btn.classList.add("good");$("feedback").textContent=combo>=3?`正确 · ${combo} 连击`:"正确";$("feedback").className="feedback good";playGood()}
  else{wrong++;combo=0;stat[item.word].wrong++;stat[item.word].last=Date.now();if(btn)btn.classList.add("bad");$("feedback").textContent=timeout?`超时 · ${item.def}`:`不对 · 正确答案：${item.def}`;$("feedback").className="feedback bad";playBad();document.querySelectorAll(".opt").forEach(b=>{if(b.textContent===item.def)b.classList.add("good")})}
  saveStats(stat);refreshCounts();$("nextBtn").classList.remove("hide");
}
function nextQuestion(){playClick();idx++;if(idx>=round.length){finish()}else{showQuestion()}}
function finish(){clearInterval(timerId);$("game").classList.add("hide");$("result").classList.remove("hide");$("rScore").textContent=score;$("rCorrect").textContent=correct;$("rWrong").textContent=wrong;$("resultText").textContent=`本轮 ${round.length} 题，正确 ${correct} 题。错题已经进入你的记忆链。`;tone(880,.1);setTimeout(()=>tone(1100,.14),80)}
function showMemory(){clearInterval(timerId);$("home").classList.add("hide");$("game").classList.add("hide");$("result").classList.add("hide");$("memory").classList.remove("hide");const s=getStats();const arr=Object.entries(s).filter(([_,v])=>v.wrong>0).sort((a,b)=>b[1].wrong-a[1].wrong);$("memoryList").innerHTML=arr.length?arr.slice(0,100).map(([w,v])=>{const x=words.find(q=>q.word===w);return `<div class="item"><b>${w}</b><span>${x?x.def:""} · 错 ${v.wrong} 次 · 对 ${v.correct} 次</span></div>`}).join(""):"<p class='muted'>还没有强化词。开始一轮游戏吧。</p>"}
function goHome(){clearInterval(timerId);$("memory").classList.add("hide");$("result").classList.add("hide");$("game").classList.add("hide");$("home").classList.remove("hide");refreshCounts()}
loadWords();
</script>
</body>
</html>
